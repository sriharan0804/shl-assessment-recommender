services:
  - type: web
    name: shl-assessment-recommender
    env: python
    buildCommand: "python -m pip install -r requirements.txt && python scripts/preprocess_catalog.py && python scripts/build_vector_index.py"
    startCommand: "python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    plan: free